<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SHE Internship Tracker</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>
    <img
        src="images/shpe-banner.png"
        alt="SHPE 2026 National Convention — Indianapolis, IN — October 28-31 — shpe.org/2026"
        class="convention-banner"
    >
    <main class="container">
        <header>
            <h1>SHE Internship Tracker</h1>

            <p>
                Internship, fellowship, student, and early-career
                listings collected from company career boards.
            </p>
        </header>

        <section class="controls">
            <input
                id="search-input"
                type="search"
                placeholder="Search company, title, or location"
            >

            <select id="company-filter">
                <option value="">All companies</option>
            </select>

            <select id="ats-filter">
                <option value="">All platforms</option>
                <option value="greenhouse">Greenhouse</option>
                <option value="ashby">Ashby</option>
                <option value="workday">Workday</option>
            </select>
        </section>

        <section
            class="major-filters"
            id="major-filters"
            aria-label="Filter by engineering major"
        >
            <!-- Major filter buttons are added here by app.js -->
        </section>

        <p id="job-count">
            Loading jobs...
        </p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Location</th>
                        <th>Major(s)</th>
                        <th>Platform</th>
                        <th>Application</th>
                    </tr>
                </thead>

                <tbody id="jobs-table-body"></tbody>
            </table>
        </div>

        <p
            id="error-message"
            class="error"
        ></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
