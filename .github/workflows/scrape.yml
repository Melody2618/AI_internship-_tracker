name: Scrape internship postings

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-genai python-dotenv requests firebase-admin

      - name: Run the scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 src/main.py

      - name: Write Firebase service account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-service-account.json

      - name: Push job data to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: |
          python3 src/push_to_firestore.py

      - name: Remove service account credentials
        if: always()
        run: |
          rm -f /tmp/firebase-service-account.json

      - name: Commit updated output (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/classification_cache.json data/worklog.md
          git diff --staged --quiet || git commit -m "Auto-update job postings [skip ci]"
          git pull --rebase origin main
          git push
