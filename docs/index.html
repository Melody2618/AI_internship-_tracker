<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--
      Forward visitors from the old GitHub Pages address to Firebase
      Hosting. Sign-in only works reliably on phones when the site and
      the sign-in handler share a domain (she-internship-tracker.firebaseapp.com).
      Has no effect when the page is already served from Firebase.
    -->
    <script>
        if (location.hostname.endsWith("github.io")) {
            location.replace("https://she-internship-tracker.firebaseapp.com" + location.search + location.hash);
        }
    </script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SHE Internship Tracker</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <!--
      Firebase config only, no SDK scripts here. Everything Firebase-
      related (Auth and Firestore) is loaded via ES module imports at
      the top of app.js instead. Mixing the older compat build with
      modular imports caused a bug
